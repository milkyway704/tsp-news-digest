name: CNA News Bot

on:
    schedule:
        - cron: "0 0,10 * * *" # UTC 00,10 = 台灣 08:00, 18:00
    workflow_dispatch:

jobs:
    run:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  # 已移除 cache: "npm"，避免找不到 lock 檔的錯誤

            - name: Install dependencies
              # 改回使用 npm install
              run: npm install

            - name: Run script
              run: node index.js
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  SHEET_ID: ${{ secrets.SHEET_ID }}
                  GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
