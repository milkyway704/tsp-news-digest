name: CNA News Bot

on:
    schedule:
        - cron: "0 0,10 * * *" # UTC 00,10 = 台灣 08:00, 18:00
    workflow_dispatch:

jobs:
    run:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  # 新增這行：自動根據 package-lock.json 快取 npm 套件
                  cache: "npm"

            - name: Install dependencies
              # 使用 npm ci 取代 npm install，專為 CI 環境設計，安裝更快速且穩定
              run: npm ci

            - name: Run script
              run: node index.js
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  SHEET_ID: ${{ secrets.SHEET_ID }}
                  GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
